[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fractal-agents"
version = "0.2.1"
description = "Recursive agentic framework for complex task execution"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Cody Blevins", email = "cody@flexinfer.ai" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "redis>=5.0.0",
    "pydantic>=2.0.0",
    "litellm>=1.0.0",
    "langgraph>=0.0.1",
    "qdrant-client>=1.7.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.0.0",
    "lz4>=4.3.0",
    "flexinfer-diagram-gen>=0.3.1",
]

[project.optional-dependencies]
observability = [
    "flexinfer-observability>=0.3.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "pre-commit>=3.5.0",
    "types-redis",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fractal_agents"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
