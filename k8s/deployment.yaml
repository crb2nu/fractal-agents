apiVersion: apps/v1
kind: Deployment
metadata:
  name: fractal-agents-core
  namespace: ai
  labels:
    app: fractal-agents
  annotations:
    litellm.flexinfer.ai/served-model: "fractal-agent-v1"
    litellm.flexinfer.ai/aliases: "fractal-agent,fractal"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fractal-agents
  template:
    metadata:
      labels:
        app: fractal-agents
    spec:
      initContainers:
      - name: clone
        image: alpine/git
        command:
        - sh
        - -c
        - |
          git clone http://oauth2:$(GIT_PASSWORD)@gitlab.gitlab.svc.cluster.local:8080/libs/fractal-agents.git /app
        env:
        - name: GIT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gitops-gitlab
              key: password
        volumeMounts:
        - name: app-code
          mountPath: /app
      containers:
      - name: core
        image: python:3.9-slim
        workingDir: /app
        command: 
        - "/bin/sh"
        - "-c"
        - |
          pip install -r requirements.txt
          export PYTHONPATH=$PYTHONPATH:/app/src
          python src/fractal_agents/server.py
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: LITELLM_API_BASE
          value: "http://litellm.ai.svc.cluster.local:8000/v1"
        - name: LITELLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-credentials
              key: masterKey
              optional: true
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: langgraph-redis-auth
              key: redis-password
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@langgraph-redis-master.ai.svc.cluster.local:6379/0"
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: app-code
          mountPath: /app
        resources:
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: app-code
        emptyDir: {}
