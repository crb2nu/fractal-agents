apiVersion: v1
kind: Namespace
metadata:
  name: fractal-agents
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fractal-agents-core
  namespace: fractal-agents
  labels:
    app: fractal-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fractal-agents
  template:
    metadata:
      labels:
        app: fractal-agents
    spec:
      containers:
      - name: core
        image: python:3.9-slim
        command: ["/bin/sh", "-c", "while true; do echo 'Fractal Agents Running'; sleep 3600; done"]
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
