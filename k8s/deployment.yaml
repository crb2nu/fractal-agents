apiVersion: apps/v1
kind: Deployment
metadata:
  name: fractal-agents-core
  namespace: fractal-agents
  labels:
    app: fractal-agents
  annotations:
    litellm.flexinfer.ai/served-model: "fractal-agent-v1"
    litellm.flexinfer.ai/aliases: "fractal-agent,fractal"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fractal-agents
  template:
    metadata:
      labels:
        app: fractal-agents
    spec:
      containers:
      - name: core
        image: python:3.9-slim
        command: 
        - "/bin/sh"
        - "-c"
        - |
          pip install -r requirements.txt
          export PYTHONPATH=$PYTHONPATH:$(pwd)/src
          python src/fractal_agents/server.py
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: LITELLM_API_BASE
          value: "http://litellm.ai.svc.cluster.local:8000/v1"
        - name: LITELLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-credentials
              key: masterKey
              optional: true
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: REDIS_PASSWORD
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@langgraph-redis-master.ai.svc.cluster.local:6379/0"
        ports:
        - containerPort: 8000
        resources:
          limits:
            memory: "1Gi"
            cpu: "1000m"
