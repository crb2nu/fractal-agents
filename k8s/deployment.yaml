apiVersion: apps/v1
kind: Deployment
metadata:
  name: fractal-agents-core
  namespace: ai
  labels:
    app: fractal-agents
  annotations:
    litellm.flexinfer.ai/served-model: "fractal-agent-v1"
    litellm.flexinfer.ai/aliases: "fractal-agent,fractal"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fractal-agents
  template:
    metadata:
      labels:
        app: fractal-agents
    spec:
      containers:
      - name: core
        image: registry.harbor.lan/flexinfer/fractal-agents:latest
        imagePullPolicy: Always
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: LITELLM_API_BASE
          value: "http://litellm.ai.svc.cluster.local:8000/v1"
        - name: LITELLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-credentials
              key: masterKey
              optional: true
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: langgraph-redis-auth
              key: redis-password
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@langgraph-redis-master.ai.svc.cluster.local:6379/0"
        - name: QDRANT_URL
          value: "http://192.168.50.176:6333"
        - name: WEAVIATE_URL
          value: "http://weaviate.ai.svc.cluster.local:8080"
        - name: QDRANT_API_KEY
          valueFrom:
            secretKeyRef:
              name: fractal-secrets
              key: QDRANT_API_KEY
              optional: true
        ports:
        - containerPort: 8000
        resources:
          limits:
            memory: "1Gi"
            cpu: "1000m"
      imagePullSecrets:
        - name: gitlab-registry
