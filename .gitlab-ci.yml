# Python CI - Uses shared templates from platform/gitops
include:
  - project: "platform/gitops"
    file: "/ci/templates/python.yml"

stages: [lint, test, build, publish]

# Override base to use requirements.txt instead of pyproject.toml
.python-base:
  image: python:3.12
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  cache:
    key: "${CI_COMMIT_REF_SLUG}-python"
    paths:
      - .pip-cache/
      - .venv/
  before_script:
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip wheel
    - pip install -r requirements.txt

lint:
  extends: .python-lint
  image: python:3.12
  allow_failure: false

test:
  extends: .python-base
  stage: test
  services:
    - redis:7-alpine
  variables:
    REDIS_URL: "redis://redis:6379/0"
  script:
    - pip install pytest pytest-asyncio
    - python -m pytest tests/ -v

build:docker:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  variables:
    HARBOR_REGISTRY: registry.harbor.lan/flexinfer
    IMAGE_NAME: fractal-agents
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${HARBOR_REGISTRY}\":{\"username\":\"${HARBOR_REGISTRY_USER}\",\"password\":\"${HARBOR_REGISTRY_PASSWORD}\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${HARBOR_REGISTRY}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
      --destination "${HARBOR_REGISTRY}/${IMAGE_NAME}:latest"
      --cache=true
      --cache-repo="${HARBOR_REGISTRY}/${IMAGE_NAME}/cache"
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

deploy:k3s:
  stage: publish
  image: bitnami/kubectl:latest
  variables:
    KUBECONFIG: /tmp/kubeconfig
    HARBOR_REGISTRY: registry.harbor.lan/flexinfer
    IMAGE_NAME: fractal-agents
  before_script:
    - echo "$KUBE_CONFIG" | base64 -d > $KUBECONFIG
  script:
    - kubectl -n ai set image deployment/fractal-agents-core core=${HARBOR_REGISTRY}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    - kubectl -n ai rollout status deployment/fractal-agents-core --timeout=120s
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
