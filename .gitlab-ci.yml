# Python CI - Uses shared templates from platform/gitops
include:
  - project: "platform/gitops"
    file: "/ci/templates/python.yml"

stages: [lint, test, build, publish]

variables:
  KANIKO_IMAGE: "gcr.io/kaniko-project/executor:debug"

# Override base to use requirements.txt instead of pyproject.toml
.python-base:
  image: python:3.11
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  cache:
    key: "${CI_COMMIT_REF_SLUG}-python"
    paths:
      - .pip-cache/
      - .venv/
  before_script:
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip wheel
    - pip install -r requirements.txt

lint:
  extends: .python-lint
  image: python:3.11
  allow_failure: false

test:
  extends: .python-base
  stage: test
  services:
    - redis:7-alpine
  variables:
    REDIS_URL: "redis://redis:6379/0"
  script:
    - pip install pytest pytest-asyncio
    - python -m pytest tests/ -v

build:docker:
  stage: build
  image:
    name: ${KANIKO_IMAGE}
    entrypoint: [""]
  variables:
    HARBOR_REGISTRY: registry.harbor.lan/flexinfer
    IMAGE_NAME: fractal-agents
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${HARBOR_REGISTRY}\":{\"username\":\"${HARBOR_USERNAME}\",\"password\":\"${HARBOR_PASSWORD}\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${HARBOR_REGISTRY}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
      --destination "${HARBOR_REGISTRY}/${IMAGE_NAME}:latest"
      --cache=true
      --cache-repo="${HARBOR_REGISTRY}/${IMAGE_NAME}/cache"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Deployment is handled by Flux GitOps - it monitors this repo and auto-deploys
# when k8s/deployment.yaml changes. The image uses :latest which is updated
# by the build:docker stage above.
