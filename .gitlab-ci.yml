# Python CI - Uses shared templates from platform/gitops
include:
  - project: 'platform/gitops'
    file: '/ci/templates/python.yml'

stages: [lint, test, build, publish]

# Override base to use requirements.txt instead of pyproject.toml
.python-base:
  image: python:${PYTHON_VERSION:-3.12}
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  cache:
    key: "${CI_COMMIT_REF_SLUG}-python"
    paths:
      - .pip-cache/
      - .venv/
  before_script:
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip wheel
    - pip install -r requirements.txt

lint:
  extends: .python-lint

test:
  extends: .python-base
  stage: test
  services:
    - redis:7-alpine
  variables:
    REDIS_URL: "redis://redis:6379/0"
  script:
    - pip install pytest pytest-asyncio
    - python -m pytest tests/ -v
  allow_failure: true  # Tests may require external services

build:docker:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker build -t ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA} .
    - docker tag ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA} ${CI_REGISTRY_IMAGE}:latest
  only:
    - main
    - tags
