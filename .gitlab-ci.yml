# Python CI - Uses shared templates from platform/gitops
include:
  - project: "platform/gitops"
    file: "/ci/templates/python.yml"

stages: [lint, test, build, publish]

# Override base to use requirements.txt instead of pyproject.toml
.python-base:
  image: python:3.12
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  cache:
    key: "${CI_COMMIT_REF_SLUG}-python"
    paths:
      - .pip-cache/
      - .venv/
  before_script:
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip wheel
    - pip install -r requirements.txt

lint:
  extends: .python-lint
  image: python:3.12
  allow_failure: false

test:
  extends: .python-base
  stage: test
  services:
    - redis:7-alpine
  variables:
    REDIS_URL: "redis://redis:6379/0"
  script:
    - pip install pytest pytest-asyncio
    - python -m pytest tests/ -v

build:docker:
  stage: build
  image:
    name: moby/buildkit:latest
    entrypoint: [""]
  variables:
    HARBOR_REGISTRY: registry.harbor.lan/flexinfer
    IMAGE_NAME: fractal-agents
  before_script:
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"${HARBOR_REGISTRY}\":{\"auth\":\"$(echo -n ${HARBOR_USER}:${HARBOR_PASSWORD} | base64)\"}}}" > ~/.docker/config.json
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --output type=image,name=${HARBOR_REGISTRY}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA},push=true \
        --output type=image,name=${HARBOR_REGISTRY}/${IMAGE_NAME}:latest,push=true \
        --export-cache type=registry,ref=${HARBOR_REGISTRY}/${IMAGE_NAME}:buildcache \
        --import-cache type=registry,ref=${HARBOR_REGISTRY}/${IMAGE_NAME}:buildcache
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

deploy:k3s:
  stage: publish
  image: bitnami/kubectl:latest
  variables:
    KUBECONFIG: /tmp/kubeconfig
    HARBOR_REGISTRY: registry.harbor.lan/flexinfer
    IMAGE_NAME: fractal-agents
  before_script:
    - echo "$KUBE_CONFIG" | base64 -d > $KUBECONFIG
  script:
    - kubectl -n ai set image deployment/fractal-agents-core core=${HARBOR_REGISTRY}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    - kubectl -n ai rollout status deployment/fractal-agents-core --timeout=120s
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
